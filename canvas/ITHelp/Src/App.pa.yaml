App:
  Properties:
    Formulas: |-
      =// Design tokens. The client's brand lives here and only here: screens use these names, never RGBA literals (D11).
      // Derived from the accepted prototype (no brand guide), light and dark schemes: specs/design-spec.md section 2 (AC-ITH-09.1). Never rename a token.
      IsDark = Coalesce(First(colScheme).Value, "Light") = "Dark";
      ColorPrimary = RGBA(79, 70, 229, 1);
      ColorPrimaryHover = RGBA(67, 56, 202, 1);
      ColorPrimaryPressed = RGBA(55, 48, 163, 1);
      ColorOnPrimary = RGBA(255, 255, 255, 1);
      ColorSecondary = If(IsDark, RGBA(230, 233, 239, 1), RGBA(16, 24, 40, 1));
      ColorOnSecondary = If(IsDark, RGBA(16, 24, 40, 1), RGBA(255, 255, 255, 1));
      ColorOnSecondaryMuted = RGBA(255, 255, 255, 0.8);
      ColorText = If(IsDark, RGBA(230, 233, 239, 1), RGBA(16, 24, 40, 1));
      ColorTextMuted = If(IsDark, RGBA(152, 162, 179, 1), RGBA(102, 112, 133, 1));
      ColorBorder = If(IsDark, RGBA(101, 112, 132, 1), RGBA(131, 138, 152, 1));
      ColorDivider = If(IsDark, RGBA(38, 48, 65, 1), RGBA(228, 231, 236, 1));
      ColorBackground = If(IsDark, RGBA(11, 15, 23, 1), RGBA(246, 247, 249, 1));
      ColorSurface = If(IsDark, RGBA(18, 24, 38, 1), RGBA(255, 255, 255, 1));
      ColorDisabled = RGBA(161, 159, 157, 1);
      ColorTransparent = RGBA(0, 0, 0, 0);
      ColorHoverOverlay = RGBA(0, 0, 0, 0.06);
      ColorPressedOverlay = RGBA(0, 0, 0, 0.12);
      ColorOverlay = If(IsDark, RGBA(0, 0, 0, 0.67), RGBA(16, 24, 40, 0.4));
      ColorSuccessFill = If(IsDark, RGBA(34, 54, 57, 1), RGBA(222, 237, 228, 1));
      ColorWarningFill = If(IsDark, RGBA(51, 50, 43, 1), RGBA(244, 231, 221, 1));
      ColorErrorFill = If(IsDark, RGBA(51, 44, 56, 1), RGBA(245, 223, 223, 1));
      ColorInfoFill = If(IsDark, RGBA(36, 48, 68, 1), RGBA(223, 230, 250, 1));
      ColorNeutralFill = If(IsDark, RGBA(44, 50, 64, 1), RGBA(229, 231, 234, 1));
      ColorError = If(IsDark, RGBA(252, 165, 165, 1), RGBA(185, 28, 28, 1));
      ColorErrorHover = RGBA(170, 40, 62, 1);
      ColorErrorPressed = RGBA(140, 30, 50, 1);
      ColorNoteFill = RGBA(255, 244, 206, 1);
      ColorNoteBorder = RGBA(232, 201, 90, 1);
      FontBody = Font.'Segoe UI';
      ColorPrimaryTint = If(IsDark, RGBA(30, 35, 71, 1), RGBA(238, 242, 255, 1));
      ColorPrimaryTintBorder = RGBA(199, 210, 254, 1);
      ColorAccentText = If(IsDark, RGBA(129, 140, 248, 1), RGBA(79, 70, 229, 1));
      ColorSunken = If(IsDark, RGBA(21, 27, 41, 1), RGBA(252, 252, 253, 1));
      ColorHover = If(IsDark, RGBA(27, 35, 53, 1), RGBA(242, 244, 247, 1));
      ColorRowHover = If(IsDark, RGBA(22, 29, 44, 1), RGBA(249, 250, 251, 1));
      ColorLine = If(IsDark, RGBA(28, 36, 52, 1), RGBA(240, 242, 245, 1));
      ColorDot = RGBA(220, 38, 38, 1);
      ColorSuccess = If(IsDark, RGBA(134, 239, 172, 1), RGBA(20, 120, 57, 1));
      ColorWarning = If(IsDark, RGBA(252, 211, 77, 1), RGBA(169, 78, 8, 1));
      ColorInfo = If(IsDark, RGBA(147, 197, 253, 1), RGBA(29, 78, 216, 1));
      ColorNeutralText = If(IsDark, RGBA(203, 213, 225, 1), RGBA(71, 84, 103, 1));
      ColorClosed = If(IsDark, RGBA(148, 163, 184, 1), RGBA(97, 106, 126, 1));
      ColorClosedFill = If(IsDark, RGBA(36, 43, 58, 1), RGBA(234, 235, 238, 1));
      ColorHigh = If(IsDark, RGBA(253, 186, 116, 1), RGBA(186, 62, 12, 1));
      ColorHighFill = If(IsDark, RGBA(51, 47, 49, 1), RGBA(246, 228, 221, 1));
      HexPrimary = "#4f46e5";
      HexAccentText = If(IsDark, "#818cf8", "#4f46e5");
      HexText = If(IsDark, "#e6e9ef", "#101828");
      HexTextMuted = If(IsDark, "#98a2b3", "#667085");
      HexSurface = If(IsDark, "#121826", "#ffffff");
      HexDivider = If(IsDark, "#263041", "#e4e7ec");
      HexPrimaryTint = If(IsDark, "#1e2347", "#eef2ff");
      HexHover = If(IsDark, "#1b2335", "#f2f4f7");
      HexInfo = If(IsDark, "#93c5fd", "#1d4ed8");
      HexWarning = If(IsDark, "#fcd34d", "#a94e08");
      HexNeutralText = If(IsDark, "#cbd5e1", "#475467");
      HexSuccess = If(IsDark, "#86efac", "#147839");
      HexClosed = If(IsDark, "#94a3b8", "#616a7e");
      HexHigh = If(IsDark, "#fdba74", "#ba3e0c");
      HexError = If(IsDark, "#fca5a5", "#b91c1c");
      HexOnPrimary = "#ffffff";
      // Rules used on more than one screen are defined once here (D5). Collections are loaded by each screen (ui-patterns section 6).
      AppTitle = "IT Help";
      SideW = If(varCollapsed, 64, 232);  // the sidebar, folded or not (AC-ITH-03.1)
      // The first letters of the first two words of a name, as the prototype's ini() does (AC-ITH-05.2)
      Initials(n: Text): Text = Upper(Left(n, 1) & If(IsBlank(Find(" ", n)), "", Mid(n, Find(" ", n) + 1, 1)));
      // How long ago, as the prototype's rel() words it (AC-ITH-07.3)
      RelTime(t: DateTime): Text = With({m: DateDiff(t, Now(), TimeUnit.Minutes)}, If(m < 1, "just now", m < 60, m & " min ago", m < 1440, Round(m / 60, 0) & " h ago", Round(m / 1440, 0) & " d ago"));
      MyRole = Coalesce(LookUp(colRole, Lower(UserEmail) = Lower(User().Email) && IsActive).UserRole, "Requester");  // from the role list, D-03 (AC-ITH-05.3)
      IsStaff = MyRole = "Technician" || MyRole = "Administrator";  // AC-ITH-40.1
      IsAdmin = MyRole = "Administrator";  // AC-ITH-41.1
      CanChange = IsStaff;  // status, priority, assignment, resolve and close (AC-ITH-25.6, AC-ITH-39.4)
      CanEdit = IsStaff;  // edit ticket details (AC-ITH-26.5, baseline Q-08)
      MyEmail = Lower(User().Email);
      MyOpenCount = CountRows(Filter(colTickets, Lower(RequesterEmail) = MyEmail && !IsFinal));  // AC-ITH-02.4
      AssignedOpenCount = CountRows(Filter(colTickets, Lower(AssignedToEmail) = MyEmail && !IsFinal));  // AC-ITH-02.4
      ResolvedToday = CountRows(Filter(colTickets, TicketStatus = "Resolved" && DateValue(Modified) = Today()));  // AC-ITH-11.2
      RecentTickets = FirstN(SortByColumns(colTickets, "ID", SortOrder.Descending), 6);  // AC-ITH-12.1
      MyAssigned = FirstN(Filter(SortByColumns(colTickets, "ID", SortOrder.Descending), Lower(AssignedToEmail) = MyEmail && !IsFinal), 5);  // AC-ITH-12.2
      RecentActivity = Filter(SortByColumns(colActivityAll, "ID", SortOrder.Descending), TicketId in colTickets.ID);  // AC-ITH-07.2 and AC-ITH-14.1, only tickets the user may see (Q-18)
      BaseTickets = Switch(varView, "mine", Filter(colTickets, Lower(RequesterEmail) = MyEmail), "assigned", Filter(colTickets, Lower(AssignedToEmail) = MyEmail), colTickets);  // AC-ITH-19.1
      FilteredTickets = Filter(BaseTickets, (IsBlank(Trim(varSearch)) || Lower(Trim(varSearch)) in Lower(Code & " " & Title)) && (varFStatus = "" || TicketStatus = varFStatus) && (varFPriority = "" || Priority = varFPriority) && (varFCategory = "" || Category = varFCategory));  // AC-ITH-16.1
      SortedTickets = SortByColumns(FilteredTickets, varSort, If(varDesc, SortOrder.Descending, SortOrder.Ascending));  // AC-ITH-17.1
      PageCount = Max(1, RoundUp(CountRows(FilteredTickets) / varPageSize, 0));  // AC-ITH-17.3
      PagedTickets = LastN(FirstN(SortedTickets, varPage * varPageSize), Max(0, Min(varPageSize, CountRows(SortedTickets) - (varPage - 1) * varPageSize)));  // AC-ITH-17.3
      FilteredArticles = Filter(SortByColumns(Filter(colArticles, IsActive), "SortOrder", SortOrder.Ascending), (varKC = "" || ArticleCategory = varKC) && (IsBlank(Trim(varKQ)) || Lower(Trim(varKQ)) in Lower(Title & " " & ArticleSummary)));  // AC-ITH-35.3
      ArticleSteps = If(IsBlank(varArticle), Table({N: 0, Text: ""}), ForAll(Sequence(CountRows(Split(varArticle.ArticleSteps, Char(10)))), {N: Value, Text: Index(Split(varArticle.ArticleSteps, Char(10)), Value).Result}));  // AC-ITH-36.1
      CsvText = "Ticket ID,Subject,Requester,Category,Priority,Status,Assigned To,Created Date,Last Updated" & Char(10) & Concat(SortedTickets, Code & "," & """" & Substitute(Title, """", """""") & """," & """" & RequesterName & """," & Category & "," & Priority & "," & TicketStatus & "," & """" & AssignedToName & """," & CreatedText & "," & ModifiedFull & Char(10));  // AC-ITH-42.1
    OnStart: |-
      =Set(varCollapsed, false); // fx-ignore FX-DELEG the role and master-data lists hold under 500 items by design (data-model.md)
      Set(varMenu, ""); // AC-ITH-01.1 the app starts here, data comes from SharePoint lists
      Set(varNotifRead, false);
      Set(varModal, "");
      Set(varDrawer, false);
      Set(varFormMode, "new");
      Set(varFormKey, 0);
      Set(varErrSubject, false);
      Set(varErrDesc, false);
      Set(varErrEmail, false);
      Set(varSaving, false);
      Set(varPrefill, "");
      Set(varView, "all");
      Set(varSearch, "");
      Set(varFStatus, "");
      Set(varFPriority, "");
      Set(varFCategory, "");
      Set(varSort, "ID");
      Set(varDesc, true);
      Set(varPage, 1);
      Set(varPageSize, 10);
      Set(varKQ, "");
      Set(varKC, "");
      Set(varArticle, Blank());
      Set(varTicket, Blank());
      Set(varLast, Blank());
      Set(varSavedMsg, "");
      Set(varLoading, false);
      Set(varLoadError, "");
      Set(varLoadReason, "");
      ClearCollect(colScheme, {Value: "Light"});
      IfError(ClearCollect(colRole, ForAll(Filter(ITH_UserRole, UserEmail = User().Email), {UserEmail: UserEmail, UserRole: UserRole.Value, IsActive: IsActive})), Clear(colRole));
      ClearCollect(colCategory, ForAll(SortByColumns(Filter(ITH_Category, ID > 0), "SortOrder", SortOrder.Ascending), {ID: ID, Title: Title, SortOrder: Coalesce(SortOrder, 0), IsActive: IsActive}));
      ClearCollect(colPriority, ForAll(SortByColumns(Filter(ITH_Priority, ID > 0), "SortOrder", SortOrder.Ascending), {ID: ID, Title: Title, PriorityDefinition: Coalesce(PriorityDefinition, ""), SortOrder: Coalesce(SortOrder, 0), IsActive: IsActive}));
      ClearCollect(colStatus, ForAll(SortByColumns(Filter(ITH_Status, ID > 0), "SortOrder", SortOrder.Ascending), {ID: ID, Title: Title, StatusDefinition: Coalesce(StatusDefinition, ""), SortOrder: Coalesce(SortOrder, 0), IsFinal: IsFinal, IsActive: IsActive}));
      ClearCollect(colTechnician, ForAll(SortByColumns(Filter(ITH_Technician, ID > 0), "SortOrder", SortOrder.Ascending), {ID: ID, Title: Title, TechnicianEmail: Coalesce(TechnicianEmail, ""), SortOrder: Coalesce(SortOrder, 0), IsActive: IsActive}));
      ClearCollect(colArticles, ForAll(SortByColumns(Filter(ITH_Article, ID > 0), "SortOrder", SortOrder.Ascending), {ID: ID, Title: Title, ArticleCategory: Coalesce(ArticleCategory, ""), ArticleSummary: Coalesce(ArticleSummary, ""), ArticleSteps: Coalesce(ArticleSteps, ""), SortOrder: Coalesce(SortOrder, 0), IsActive: IsActive}));
      ClearCollect(colStatusOpt, ForAll(SortByColumns(Filter(colStatus, IsActive), "SortOrder", SortOrder.Ascending), {Value: Title}));
      ClearCollect(colPriorityOpt, ForAll(SortByColumns(Filter(colPriority, IsActive), "SortOrder", SortOrder.Ascending), {Value: Title}));
      ClearCollect(colCategoryOpt, ForAll(SortByColumns(Filter(colCategory, IsActive), "SortOrder", SortOrder.Ascending), {Value: Title}));
      ClearCollect(colAssignOpt, {Value: "Unassigned"}); // AC-ITH-31.2
      Collect(colAssignOpt, ForAll(SortByColumns(Filter(colTechnician, IsActive), "SortOrder", SortOrder.Ascending), {Value: Title}));
      ClearCollect(colFStatus, {Value: "All statuses"}); // AC-ITH-38.1
      Collect(colFStatus, colStatusOpt);
      ClearCollect(colFPriority, {Value: "All priorities"});
      Collect(colFPriority, colPriorityOpt);
      ClearCollect(colFCategory, {Value: "All categories"});
      Collect(colFCategory, colCategoryOpt);
      ClearCollect(colPageSizes, {Value: 5}, {Value: 10}, {Value: 25});
      ClearCollect(colArticleCats, Distinct(Filter(colArticles, IsActive), ArticleCategory))
    StartScreen: =scrOverview
    Theme: =PowerAppsTheme
