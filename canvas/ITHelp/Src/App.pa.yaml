      ColorPrimary = RGBA(15, 108, 189, 1);
      ColorPrimaryHover = RGBA(16, 94, 165, 1);
      ColorPrimaryPressed = RGBA(12, 76, 134, 1);
      ColorOnPrimary = RGBA(255, 255, 255, 1);
      ColorSecondary = RGBA(15, 42, 74, 1);
      ColorOnSecondary = RGBA(255, 255, 255, 1);
      ColorOnSecondaryMuted = RGBA(255, 255, 255, 0.8);
      ColorText = RGBA(32, 31, 30, 1);
      ColorTextMuted = RGBA(96, 94, 92, 1);
      ColorBorder = RGBA(138, 136, 134, 1);
      ColorDivider = RGBA(210, 208, 206, 1);
      ColorBackground = RGBA(255, 255, 255, 1);
      ColorSurface = RGBA(243, 242, 241, 1);
      ColorDisabled = RGBA(161, 159, 157, 1);
      ColorTransparent = RGBA(0, 0, 0, 0);
