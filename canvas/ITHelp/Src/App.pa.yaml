App:
  Properties:
    Formulas: |-
      =// Design tokens. The client's brand lives here and only here: screens use these names, never RGBA literals (D11).
      // Derived from the accepted prototype (no brand guide), light and dark schemes: specs/design-spec.md section 2 (AC-ITH-09.1). Never rename a token.
      IsDark = Coalesce(First(colScheme).Value, "Light") = "Dark";
      ColorPrimary = RGBA(79, 70, 229, 1);
      ColorPrimaryHover = RGBA(67, 56, 202, 1);
      ColorPrimaryPressed = RGBA(55, 48, 163, 1);
      ColorOnPrimary = RGBA(255, 255, 255, 1);
      ColorSecondary = If(IsDark, RGBA(230, 233, 239, 1), RGBA(16, 24, 40, 1));
      ColorOnSecondary = If(IsDark, RGBA(16, 24, 40, 1), RGBA(255, 255, 255, 1));
      ColorOnSecondaryMuted = RGBA(255, 255, 255, 0.8);
      ColorText = If(IsDark, RGBA(230, 233, 239, 1), RGBA(16, 24, 40, 1));
      ColorTextMuted = If(IsDark, RGBA(152, 162, 179, 1), RGBA(102, 112, 133, 1));
      ColorBorder = If(IsDark, RGBA(101, 112, 132, 1), RGBA(131, 138, 152, 1));
      ColorDivider = If(IsDark, RGBA(38, 48, 65, 1), RGBA(228, 231, 236, 1));
      ColorBackground = If(IsDark, RGBA(11, 15, 23, 1), RGBA(246, 247, 249, 1));
      ColorSurface = If(IsDark, RGBA(18, 24, 38, 1), RGBA(255, 255, 255, 1));
      ColorDisabled = RGBA(161, 159, 157, 1);
      ColorTransparent = RGBA(0, 0, 0, 0);
      ColorHoverOverlay = RGBA(0, 0, 0, 0.06);
      ColorPressedOverlay = RGBA(0, 0, 0, 0.12);
      ColorOverlay = If(IsDark, RGBA(0, 0, 0, 0.67), RGBA(16, 24, 40, 0.4));
      ColorSuccessFill = If(IsDark, RGBA(34, 54, 57, 1), RGBA(222, 237, 228, 1));
      ColorWarningFill = If(IsDark, RGBA(51, 50, 43, 1), RGBA(244, 231, 221, 1));
      ColorErrorFill = If(IsDark, RGBA(51, 44, 56, 1), RGBA(245, 223, 223, 1));
      ColorInfoFill = If(IsDark, RGBA(36, 48, 68, 1), RGBA(223, 230, 250, 1));
      ColorNeutralFill = If(IsDark, RGBA(44, 50, 64, 1), RGBA(229, 231, 234, 1));
      ColorError = If(IsDark, RGBA(252, 165, 165, 1), RGBA(185, 28, 28, 1));
      ColorErrorHover = RGBA(170, 40, 62, 1);
      ColorErrorPressed = RGBA(140, 30, 50, 1);
      ColorNoteFill = RGBA(255, 244, 206, 1);
      ColorNoteBorder = RGBA(232, 201, 90, 1);
      FontBody = Font.'Segoe UI';
      ColorPrimaryTint = If(IsDark, RGBA(30, 35, 71, 1), RGBA(238, 242, 255, 1));
      ColorPrimaryTintBorder = RGBA(199, 210, 254, 1);
      ColorAccentText = If(IsDark, RGBA(129, 140, 248, 1), RGBA(79, 70, 229, 1));
      ColorSunken = If(IsDark, RGBA(21, 27, 41, 1), RGBA(252, 252, 253, 1));
      ColorHover = If(IsDark, RGBA(27, 35, 53, 1), RGBA(242, 244, 247, 1));
      ColorRowHover = If(IsDark, RGBA(22, 29, 44, 1), RGBA(249, 250, 251, 1));
      ColorLine = If(IsDark, RGBA(28, 36, 52, 1), RGBA(240, 242, 245, 1));
      ColorDot = RGBA(220, 38, 38, 1);
      ColorSuccess = If(IsDark, RGBA(134, 239, 172, 1), RGBA(20, 120, 57, 1));
      ColorWarning = If(IsDark, RGBA(252, 211, 77, 1), RGBA(169, 78, 8, 1));
      ColorInfo = If(IsDark, RGBA(147, 197, 253, 1), RGBA(29, 78, 216, 1));
      ColorNeutralText = If(IsDark, RGBA(203, 213, 225, 1), RGBA(71, 84, 103, 1));
      ColorClosed = If(IsDark, RGBA(148, 163, 184, 1), RGBA(97, 106, 126, 1));
      ColorClosedFill = If(IsDark, RGBA(36, 43, 58, 1), RGBA(234, 235, 238, 1));
      ColorHigh = If(IsDark, RGBA(253, 186, 116, 1), RGBA(186, 62, 12, 1));
      ColorHighFill = If(IsDark, RGBA(51, 47, 49, 1), RGBA(246, 228, 221, 1));
      HexPrimary = "#4f46e5";
      HexAccentText = If(IsDark, "#818cf8", "#4f46e5");
      HexText = If(IsDark, "#e6e9ef", "#101828");
      HexTextMuted = If(IsDark, "#98a2b3", "#667085");
      HexSurface = If(IsDark, "#121826", "#ffffff");
      HexDivider = If(IsDark, "#263041", "#e4e7ec");
      HexPrimaryTint = If(IsDark, "#1e2347", "#eef2ff");
      HexHover = If(IsDark, "#1b2335", "#f2f4f7");
      HexInfo = If(IsDark, "#93c5fd", "#1d4ed8");
      HexWarning = If(IsDark, "#fcd34d", "#a94e08");
      HexNeutralText = If(IsDark, "#cbd5e1", "#475467");
      HexSuccess = If(IsDark, "#86efac", "#147839");
      HexClosed = If(IsDark, "#94a3b8", "#616a7e");
      HexHigh = If(IsDark, "#fdba74", "#ba3e0c");
      HexError = If(IsDark, "#fca5a5", "#b91c1c");
      HexOnPrimary = "#ffffff";
      // Rules used on more than one screen are defined once here (D5). Collections are loaded by each screen (ui-patterns section 6).
      AppTitle = "IT Help";
      SideW = If(varCollapsed, 64, 232);  // the sidebar, folded or not (AC-ITH-03.1)
      // The first letters of the first two words of a name, as the prototype's ini() does (AC-ITH-05.2)
      Initials(n: Text): Text = Upper(Left(n, 1) & If(IsBlank(Find(" ", n)), "", Mid(n, Find(" ", n) + 1, 1)));
      // How long ago, as the prototype's rel() words it (AC-ITH-07.3)
      RelTime(t: DateTime): Text = With({m: DateDiff(t, Now(), TimeUnit.Minutes)}, If(m < 1, "just now", m < 60, m & " min ago", m < 1440, Round(m / 60, 0) & " h ago", Round(m / 1440, 0) & " d ago"));
      MyRole = Coalesce(LookUp(colRole, Lower(UserEmail) = Lower(User().Email) && IsActive).UserRole, "Requester");  // from the role list, D-03 (AC-ITH-05.3)
      IsStaff = MyRole = "Technician" || MyRole = "Administrator";  // AC-ITH-40.1
      IsAdmin = MyRole = "Administrator";  // AC-ITH-41.1
      CanChange = IsStaff;  // status, priority, assignment, resolve and close (AC-ITH-25.6, AC-ITH-39.4)
      CanEdit = IsStaff;  // edit ticket details (AC-ITH-26.5, baseline Q-08)
      MyEmail = Lower(User().Email);
      MyOpenCount = CountRows(Filter(colTickets, Lower(RequesterEmail) = MyEmail && !IsFinal));  // AC-ITH-02.4
      AssignedOpenCount = CountRows(Filter(colTickets, Lower(AssignedToEmail) = MyEmail && !IsFinal));  // AC-ITH-02.4
      ResolvedToday = CountRows(Filter(colTickets, TicketStatus = "Resolved" && DateValue(Modified) = Today()));  // AC-ITH-11.2
      RecentTickets = FirstN(SortByColumns(colTickets, "ID", SortOrder.Descending), 6);  // AC-ITH-12.1
      MyAssigned = FirstN(Filter(SortByColumns(colTickets, "ID", SortOrder.Descending), Lower(AssignedToEmail) = MyEmail && !IsFinal), 5);  // AC-ITH-12.2
      RecentActivity = Filter(SortByColumns(colActivityAll, "ID", SortOrder.Descending), TicketId in colTickets.ID);  // AC-ITH-07.2 and AC-ITH-14.1, only tickets the user may see (Q-18)
      BaseTickets = Switch(varView, "mine", Filter(colTickets, Lower(RequesterEmail) = MyEmail), "assigned", Filter(colTickets, Lower(AssignedToEmail) = MyEmail), colTickets);  // AC-ITH-19.1
      FilteredTickets = Filter(BaseTickets, (IsBlank(Trim(varSearch)) || Lower(Trim(varSearch)) in Lower(Code & " " & Title)) && (varFStatus = "" || TicketStatus = varFStatus) && (varFPriority = "" || Priority = varFPriority) && (varFCategory = "" || Category = varFCategory));  // AC-ITH-16.1
      SortedTickets = SortByColumns(FilteredTickets, varSort, If(varDesc, SortOrder.Descending, SortOrder.Ascending));  // AC-ITH-17.1
      PageCount = Max(1, RoundUp(CountRows(FilteredTickets) / varPageSize, 0));  // AC-ITH-17.3
      PagedTickets = LastN(FirstN(SortedTickets, varPage * varPageSize), Max(0, Min(varPageSize, CountRows(SortedTickets) - (varPage - 1) * varPageSize)));  // AC-ITH-17.3
      FilteredArticles = Filter(SortByColumns(Filter(colArticles, IsActive), "SortOrder", SortOrder.Ascending), (varKC = "" || ArticleCategory = varKC) && (IsBlank(Trim(varKQ)) || Lower(Trim(varKQ)) in Lower(Title & " " & ArticleSummary)));  // AC-ITH-35.3
      ArticleSteps = If(IsBlank(varArticle), Table({N: 0, Text: ""}), ForAll(Sequence(CountRows(Split(varArticle.ArticleSteps, Char(10)))), {N: Value, Text: Index(Split(varArticle.ArticleSteps, Char(10)), Value).Result}));  // AC-ITH-36.1
      CsvText = "Ticket ID,Subject,Requester,Category,Priority,Status,Assigned To,Created Date,Last Updated" & Char(10) & Concat(SortedTickets, Code & "," & """" & Substitute(Title, """", """""") & """," & """" & RequesterName & """," & Category & "," & Priority & "," & TicketStatus & "," & """" & AssignedToName & """," & CreatedText & "," & ModifiedFull & Char(10));  // AC-ITH-42.1
      MockState = "ready";  // ready, empty or error: lets a reviewer see each state until G8
      MockTicket = Table({ID: 1001, Title: "Unable to access VPN", TicketDescription: "Cannot connect to the corporate VPN since this morning. Error 809 on home Wi-Fi.", RequesterName: "Maria Lopez", RequesterEmail: "maria.lopez@example.com", TicketCategory: "Network", TicketPriority: "High", TicketStatus: "Open", AssignedToName: "", AssignedToEmail: "", Created: DateAdd(Now(), -3, TimeUnit.Hours), Modified: DateAdd(Now(), -1, TimeUnit.Hours)}, {ID: 1002, Title: "Outlook is not syncing", TicketDescription: "Outlook has been stuck on Updating inbox since yesterday. Webmail works normally.", RequesterName: "Alex Morgan", RequesterEmail: "alex.morgan@example.com", TicketCategory: "Software", TicketPriority: "Medium", TicketStatus: "In Progress", AssignedToName: "Priya Nair", AssignedToEmail: "priya.nair@example.com", Created: DateAdd(Now(), -20, TimeUnit.Hours), Modified: DateAdd(Now(), -10, TimeUnit.Hours)}, {ID: 1003, Title: "Laptop performance issue", TicketDescription: "Laptop freezes for several seconds when more than three apps are open.", RequesterName: "Tom Becker", RequesterEmail: "tom.becker@example.com", TicketCategory: "Hardware", TicketPriority: "Medium", TicketStatus: "In Progress", AssignedToName: "Alex Morgan", AssignedToEmail: "alex.morgan@example.com", Created: DateAdd(Now(), -30, TimeUnit.Hours), Modified: DateAdd(Now(), -15, TimeUnit.Hours)}, {ID: 1004, Title: "Request for software installation", TicketDescription: "Need Adobe Acrobat Pro installed to edit signed vendor contracts.", RequesterName: "Hannah Lee", RequesterEmail: "hannah.lee@example.com", TicketCategory: "Software", TicketPriority: "Low", TicketStatus: "Open", AssignedToName: "Daniel Kim", AssignedToEmail: "daniel.kim@example.com", Created: DateAdd(Now(), -48, TimeUnit.Hours), Modified: DateAdd(Now(), -24, TimeUnit.Hours)}, {ID: 1005, Title: "Printer connection problem", TicketDescription: "The 3rd floor printer shows offline for everyone on the finance team.", RequesterName: "Raj Patel", RequesterEmail: "raj.patel@example.com", TicketCategory: "Hardware", TicketPriority: "High", TicketStatus: "On Hold", AssignedToName: "Sofia Rossi", AssignedToEmail: "sofia.rossi@example.com", Created: DateAdd(Now(), -52, TimeUnit.Hours), Modified: DateAdd(Now(), -26, TimeUnit.Hours)}, {ID: 1006, Title: "Password reset not working", TicketDescription: "Self-service reset sends the code but the page rejects it as expired.", RequesterName: "Chen Wei", RequesterEmail: "chen.wei@example.com", TicketCategory: "Access", TicketPriority: "High", TicketStatus: "Resolved", AssignedToName: "Alex Morgan", AssignedToEmail: "alex.morgan@example.com", Created: DateAdd(Now(), -6, TimeUnit.Hours), Modified: DateAdd(Now(), -3, TimeUnit.Hours)}, {ID: 1007, Title: "Shared mailbox access", TicketDescription: "Please add me to the shared Accounts Payable mailbox.", RequesterName: "Alex Morgan", RequesterEmail: "alex.morgan@example.com", TicketCategory: "Access", TicketPriority: "Low", TicketStatus: "Resolved", AssignedToName: "Priya Nair", AssignedToEmail: "priya.nair@example.com", Created: DateAdd(Now(), -3, TimeUnit.Hours), Modified: DateAdd(Now(), -1, TimeUnit.Hours)}, {ID: 1008, Title: "Monitor flickering", TicketDescription: "External monitor flickers every few minutes when docked.", RequesterName: "Maria Lopez", RequesterEmail: "maria.lopez@example.com", TicketCategory: "Hardware", TicketPriority: "Low", TicketStatus: "Closed", AssignedToName: "Daniel Kim", AssignedToEmail: "daniel.kim@example.com", Created: DateAdd(Now(), -120, TimeUnit.Hours), Modified: DateAdd(Now(), -60, TimeUnit.Hours)}, {ID: 1009, Title: "Teams calls dropping", TicketDescription: "Calls drop after about ten minutes on the office Wi-Fi.", RequesterName: "Tom Becker", RequesterEmail: "tom.becker@example.com", TicketCategory: "Network", TicketPriority: "Critical", TicketStatus: "In Progress", AssignedToName: "Sofia Rossi", AssignedToEmail: "sofia.rossi@example.com", Created: DateAdd(Now(), -8, TimeUnit.Hours), Modified: DateAdd(Now(), -4, TimeUnit.Hours)}, {ID: 1010, Title: "New starter laptop setup and accounts for the analyst starting on Monday in the finance department", TicketDescription: "Laptop and accounts needed for a new analyst starting Monday.", RequesterName: "Hannah Lee", RequesterEmail: "hannah.lee@example.com", TicketCategory: "Hardware", TicketPriority: "Medium", TicketStatus: "Open", AssignedToName: "Alex Morgan", AssignedToEmail: "alex.morgan@example.com", Created: DateAdd(Now(), -26, TimeUnit.Hours), Modified: DateAdd(Now(), -13, TimeUnit.Hours)}, {ID: 1011, Title: "Cannot open shared drive", TicketDescription: "Access denied on the Finance Reports drive since the permissions change.", RequesterName: "Raj Patel", RequesterEmail: "raj.patel@example.com", TicketCategory: "Access", TicketPriority: "Medium", TicketStatus: "Open", AssignedToName: "", AssignedToEmail: "", Created: DateAdd(Now(), -70, TimeUnit.Hours), Modified: DateAdd(Now(), -35, TimeUnit.Hours)}, {ID: 1012, Title: "Antivirus alert on laptop", TicketDescription: "Defender quarantined a file in Downloads. Want to confirm it is safe.", RequesterName: "Alex Morgan", RequesterEmail: "alex.morgan@example.com", TicketCategory: "Other", TicketPriority: "Critical", TicketStatus: "In Progress", AssignedToName: "Daniel Kim", AssignedToEmail: "daniel.kim@example.com", Created: DateAdd(Now(), -7, TimeUnit.Hours), Modified: DateAdd(Now(), -3, TimeUnit.Hours)}, {ID: 1013, Title: "Excel crashes on large files", TicketDescription: "Excel closes without warning when opening the quarterly model (45 MB).", RequesterName: "Chen Wei", RequesterEmail: "chen.wei@example.com", TicketCategory: "Software", TicketPriority: "Medium", TicketStatus: "On Hold", AssignedToName: "Priya Nair", AssignedToEmail: "priya.nair@example.com", Created: DateAdd(Now(), -96, TimeUnit.Hours), Modified: DateAdd(Now(), -48, TimeUnit.Hours)}, {ID: 1014, Title: "Request second monitor", TicketDescription: "Requesting a second monitor to support daily reporting work.", RequesterName: "Alex Morgan", RequesterEmail: "alex.morgan@example.com", TicketCategory: "Hardware", TicketPriority: "Low", TicketStatus: "Open", AssignedToName: "", AssignedToEmail: "", Created: DateAdd(Now(), -150, TimeUnit.Hours), Modified: DateAdd(Now(), -75, TimeUnit.Hours)});
      MockActivity = Table({ID: 10, TicketId: 1001, Title: "Maria Lopez created the ticket", Created: DateAdd(Now(), -3, TimeUnit.Hours)}, {ID: 11, TicketId: 1002, Title: "Alex Morgan created the ticket", Created: DateAdd(Now(), -20, TimeUnit.Hours)}, {ID: 41, TicketId: 1002, Title: "Alex Morgan assigned the ticket to Priya Nair", Created: DateAdd(Now(), -18, TimeUnit.Hours)}, {ID: 12, TicketId: 1003, Title: "Tom Becker created the ticket", Created: DateAdd(Now(), -30, TimeUnit.Hours)}, {ID: 42, TicketId: 1003, Title: "Alex Morgan assigned the ticket to Alex Morgan", Created: DateAdd(Now(), -27, TimeUnit.Hours)}, {ID: 13, TicketId: 1004, Title: "Hannah Lee created the ticket", Created: DateAdd(Now(), -48, TimeUnit.Hours)}, {ID: 43, TicketId: 1004, Title: "Alex Morgan assigned the ticket to Daniel Kim", Created: DateAdd(Now(), -43, TimeUnit.Hours)}, {ID: 14, TicketId: 1005, Title: "Raj Patel created the ticket", Created: DateAdd(Now(), -52, TimeUnit.Hours)}, {ID: 44, TicketId: 1005, Title: "Alex Morgan assigned the ticket to Sofia Rossi", Created: DateAdd(Now(), -46, TimeUnit.Hours)}, {ID: 15, TicketId: 1006, Title: "Chen Wei created the ticket", Created: DateAdd(Now(), -6, TimeUnit.Hours)}, {ID: 45, TicketId: 1006, Title: "Alex Morgan assigned the ticket to Alex Morgan", Created: DateAdd(Now(), -5, TimeUnit.Hours)}, {ID: 16, TicketId: 1007, Title: "Alex Morgan created the ticket", Created: DateAdd(Now(), -3, TimeUnit.Hours)}, {ID: 46, TicketId: 1007, Title: "Alex Morgan assigned the ticket to Priya Nair", Created: DateAdd(Now(), -2, TimeUnit.Hours)}, {ID: 17, TicketId: 1008, Title: "Maria Lopez created the ticket", Created: DateAdd(Now(), -120, TimeUnit.Hours)}, {ID: 47, TicketId: 1008, Title: "Alex Morgan assigned the ticket to Daniel Kim", Created: DateAdd(Now(), -108, TimeUnit.Hours)}, {ID: 18, TicketId: 1009, Title: "Tom Becker created the ticket", Created: DateAdd(Now(), -8, TimeUnit.Hours)}, {ID: 48, TicketId: 1009, Title: "Alex Morgan assigned the ticket to Sofia Rossi", Created: DateAdd(Now(), -7, TimeUnit.Hours)}, {ID: 19, TicketId: 1010, Title: "Hannah Lee created the ticket", Created: DateAdd(Now(), -26, TimeUnit.Hours)}, {ID: 49, TicketId: 1010, Title: "Alex Morgan assigned the ticket to Alex Morgan", Created: DateAdd(Now(), -23, TimeUnit.Hours)}, {ID: 20, TicketId: 1011, Title: "Raj Patel created the ticket", Created: DateAdd(Now(), -70, TimeUnit.Hours)}, {ID: 21, TicketId: 1012, Title: "Alex Morgan created the ticket", Created: DateAdd(Now(), -7, TimeUnit.Hours)}, {ID: 51, TicketId: 1012, Title: "Alex Morgan assigned the ticket to Daniel Kim", Created: DateAdd(Now(), -6, TimeUnit.Hours)}, {ID: 22, TicketId: 1013, Title: "Chen Wei created the ticket", Created: DateAdd(Now(), -96, TimeUnit.Hours)}, {ID: 52, TicketId: 1013, Title: "Alex Morgan assigned the ticket to Priya Nair", Created: DateAdd(Now(), -86, TimeUnit.Hours)}, {ID: 23, TicketId: 1014, Title: "Alex Morgan created the ticket", Created: DateAdd(Now(), -150, TimeUnit.Hours)});
      MockComment = Table({ID: 1, TicketId: 1002, AuthorName: "Priya Nair", CommentText: "Looking into this now. I will update the ticket shortly.", Created: DateAdd(Now(), -10, TimeUnit.Hours)}, {ID: 2, TicketId: 1005, AuthorName: "Sofia Rossi", CommentText: "Waiting on a reply before I can continue.", Created: DateAdd(Now(), -26, TimeUnit.Hours)});
      MockArticle = Table({ID: 1, Title: "How to reset your password", ArticleCategory: "Account", ArticleSummary: "Reset a forgotten or expired password using self-service.", ArticleSteps: "Go to the sign-in page and select Forgot password." & Char(10) & "Enter your work email and complete the verification code." & Char(10) & "Choose a new password of at least 12 characters.", SortOrder: 1, IsActive: true}, {ID: 2, Title: "Troubleshooting VPN connectivity", ArticleCategory: "Network", ArticleSummary: "Fix the most common VPN connection errors.", ArticleSteps: "Check that you have an internet connection without the VPN." & Char(10) & "Quit the VPN client fully and reopen it." & Char(10) & "If error 809 persists, create a ticket and include the error text.", SortOrder: 2, IsActive: true}, {ID: 3, Title: "Setting up Outlook", ArticleCategory: "Email", ArticleSummary: "Add your work mailbox to Outlook on desktop or mobile.", ArticleSteps: "Open Outlook and select Add account." & Char(10) & "Enter your work email and approve the sign-in prompt.", SortOrder: 3, IsActive: true}, {ID: 4, Title: "Requesting software access", ArticleCategory: "Software", ArticleSummary: "How to request licensed software and get it approved.", ArticleSteps: "Check the Software Center first." & Char(10) & "Create a ticket in the Software category.", SortOrder: 4, IsActive: true}, {ID: 5, Title: "Connecting to office Wi-Fi", ArticleCategory: "Network", ArticleSummary: "Join the secure office network on a new device.", ArticleSteps: "Select the staff network from the Wi-Fi list." & Char(10) & "Sign in with your work email and password.", SortOrder: 5, IsActive: true}, {ID: 6, Title: "Setting up multi-factor authentication", ArticleCategory: "Account", ArticleSummary: "Register your phone for sign-in approvals.", ArticleSteps: "Install the authenticator app from your app store." & Char(10) & "Scan the QR code and enter the six-digit code.", SortOrder: 6, IsActive: true});
      MockAttach = Table({TicketId: 1001, Name: "screenshot.png"}, {TicketId: 1005, Name: "printer-error.png"});
      MockCategory = Table({ID: 1, Title: "Hardware", SortOrder: 1, IsActive: true}, {ID: 2, Title: "Software", SortOrder: 2, IsActive: true}, {ID: 3, Title: "Network", SortOrder: 3, IsActive: true}, {ID: 4, Title: "Access", SortOrder: 4, IsActive: true}, {ID: 5, Title: "Other", SortOrder: 5, IsActive: true});
      MockPriority = Table({ID: 1, Title: "Low", PriorityDefinition: "Minor issue or question with a workaround. Target: 3 days.", SortOrder: 1, IsActive: true}, {ID: 2, Title: "Medium", PriorityDefinition: "Affects one person's work, no workaround. Target: 1 day.", SortOrder: 2, IsActive: true}, {ID: 3, Title: "High", PriorityDefinition: "Blocks a person or small team. Target: 4 hours.", SortOrder: 3, IsActive: true}, {ID: 4, Title: "Critical", PriorityDefinition: "Business-wide outage or security risk. Target: 1 hour.", SortOrder: 4, IsActive: true});
      MockStatus = Table({ID: 1, Title: "Open", StatusDefinition: "Submitted and waiting to be picked up.", SortOrder: 1, IsFinal: false, IsActive: true}, {ID: 2, Title: "In Progress", StatusDefinition: "A technician is actively working on it.", SortOrder: 2, IsFinal: false, IsActive: true}, {ID: 3, Title: "On Hold", StatusDefinition: "Waiting on the requester, a vendor, or parts.", SortOrder: 3, IsFinal: false, IsActive: true}, {ID: 4, Title: "Resolved", StatusDefinition: "A fix is in place and awaiting confirmation.", SortOrder: 4, IsFinal: true, IsActive: true}, {ID: 5, Title: "Closed", StatusDefinition: "Confirmed complete. No further work.", SortOrder: 5, IsFinal: true, IsActive: true});
      MockTechnician = Table({ID: 1, Title: "Alex Morgan", TechnicianEmail: "alex.morgan@example.com", SortOrder: 1, IsActive: true}, {ID: 2, Title: "Priya Nair", TechnicianEmail: "priya.nair@example.com", SortOrder: 2, IsActive: true}, {ID: 3, Title: "Daniel Kim", TechnicianEmail: "daniel.kim@example.com", SortOrder: 3, IsActive: true}, {ID: 4, Title: "Sofia Rossi", TechnicianEmail: "sofia.rossi@example.com", SortOrder: 4, IsActive: true});
      MockUserRole = Table({ID: 1, Title: "Mock user", UserEmail: User().Email, UserRole: {Value: "Technician"}, IsActive: true});
    OnStart: |-
      =Set(varCollapsed, false); // AC-ITH-01.1 the app starts here, data comes from SharePoint lists
      Set(varMenu, "");
      Set(varNotifRead, false);
      Set(varModal, "");
      Set(varDrawer, false);
      Set(varFormMode, "new");
      Set(varFormKey, 0);
      Set(varErrSubject, false);
      Set(varErrDesc, false);
      Set(varErrEmail, false);
      Set(varSaving, false);
      Set(varPrefill, "");
      Set(varView, "all");
      Set(varSearch, "");
      Set(varFStatus, "");
      Set(varFPriority, "");
      Set(varFCategory, "");
      Set(varSort, "ID");
      Set(varDesc, true);
      Set(varPage, 1);
      Set(varPageSize, 10);
      Set(varKQ, "");
      Set(varKC, "");
      Set(varArticle, Blank());
      Set(varTicket, Blank());
      Set(varLast, Blank());
      Set(varSavedMsg, "");
      Set(varLoading, false);
      Set(varLoadError, "");
      Set(varLoadReason, "");
      ClearCollect(colScheme, {Value: "Light"});
      ClearCollect(colRole, ForAll(MockUserRole, {UserEmail: UserEmail, UserRole: UserRole.Value, IsActive: IsActive}));
      ClearCollect(MockTicketLive, MockTicket);
      ClearCollect(MockActivityLive, MockActivity);
      ClearCollect(MockCommentLive, MockComment);
      ClearCollect(colCategory, ForAll(MockCategory, {ID: ID, Title: Title, SortOrder: Coalesce(SortOrder, 0), IsActive: IsActive}));
      ClearCollect(colPriority, ForAll(MockPriority, {ID: ID, Title: Title, PriorityDefinition: Coalesce(PriorityDefinition, ""), SortOrder: Coalesce(SortOrder, 0), IsActive: IsActive}));
      ClearCollect(colStatus, ForAll(MockStatus, {ID: ID, Title: Title, StatusDefinition: Coalesce(StatusDefinition, ""), SortOrder: Coalesce(SortOrder, 0), IsFinal: IsFinal, IsActive: IsActive}));
      ClearCollect(colTechnician, ForAll(MockTechnician, {ID: ID, Title: Title, TechnicianEmail: Coalesce(TechnicianEmail, ""), SortOrder: Coalesce(SortOrder, 0), IsActive: IsActive}));
      ClearCollect(colArticles, ForAll(MockArticle, {ID: ID, Title: Title, ArticleCategory: Coalesce(ArticleCategory, ""), ArticleSummary: Coalesce(ArticleSummary, ""), ArticleSteps: Coalesce(ArticleSteps, ""), SortOrder: Coalesce(SortOrder, 0), IsActive: IsActive}));
      ClearCollect(colStatusOpt, ForAll(SortByColumns(Filter(colStatus, IsActive), "SortOrder", SortOrder.Ascending), {Value: Title}));
      ClearCollect(colPriorityOpt, ForAll(SortByColumns(Filter(colPriority, IsActive), "SortOrder", SortOrder.Ascending), {Value: Title}));
