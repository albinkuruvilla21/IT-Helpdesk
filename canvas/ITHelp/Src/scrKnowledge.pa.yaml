                  IfError(
                      ClearCollect(colTickets, ForAll(If(MockState = "empty", Filter(MockTicket, false), If(IsStaff, MockTicket, Filter(MockTicket, RequesterEmail = User().Email))), {ID: ID, Code: "HD-" & ID, Title: Title, Details: Coalesce(TicketDescription, ""), RequesterName: Coalesce(RequesterName, ""), RequesterEmail: Coalesce(RequesterEmail, ""), Category: Coalesce(TicketCategory, ""), Priority: Coalesce(TicketPriority, ""), TicketStatus: Coalesce(TicketStatus, "Open"), AssignedToName: Coalesce(AssignedToName, ""), AssignedToEmail: Coalesce(AssignedToEmail, ""), Created: Created, Modified: Modified, CreatedText: Text(Created, "dd mmm yyyy", "en-GB"), CreatedFull: Text(Created, "dd mmm yyyy, hh:mm", "en-GB"), ModifiedFull: Text(Modified, "dd mmm yyyy, hh:mm", "en-GB"), PrioIdx: Coalesce(LookUp(colPriority, Title = TicketPriority).SortOrder, 0), StatIdx: Coalesce(LookUp(colStatus, Title = TicketStatus).SortOrder, 0), IsFinal: Coalesce(LookUp(colStatus, Title = TicketStatus).IsFinal, false)}));
