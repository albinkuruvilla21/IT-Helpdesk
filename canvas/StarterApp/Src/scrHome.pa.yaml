Screens:
  scrHome:
    Properties:
      Fill: =ColorBackground
    Children:
      - hmeHdr:
          Control: Label@2.5.1
          Properties:
            Color: =ColorText
            Font: =FontBody
            Height: =56
            Size: =12
            Text: =""""
            Width: =Parent.Width
            Fill: =ColorSecondary
      - hmeHdrTitle:
          Control: Label@2.5.1
          Properties:
            Color: =ColorOnSecondary
            Font: =FontBody
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =18
            Text: =AppTitle
            Width: =500
            X: =20
            Y: =6
            Role: =TextRole.Heading1
      - hmeHdrSub:
          Control: Label@2.5.1
          Properties:
            Color: =ColorOnSecondaryMuted
            Font: =FontBody
            Height: =18
            Size: =11
            Text: =AppSubtitle
            Width: =500
            X: =20
            Y: =32
      - hmeHdrUser:
          Control: Label@2.5.1
          Properties:
            Color: =ColorOnSecondary
            Font: =FontBody
            Height: =28
            Size: =12
            Text: ="User().FullName"
            Width: =420
            X: =Parent.Width - 440
            Y: =14
            Align: =Align.Right
      - hmeNav:
          Control: Label@2.5.1
          Properties:
            Color: =ColorText
            Font: =FontBody
            Height: =44
            Size: =12
            Text: =""""
            Width: =Parent.Width
            Y: =56
            Fill: =ColorSurface
      - hmeTabDash:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorTransparent
            BorderThickness: =1
            Color: =ColorText
            DisabledBorderColor: =ColorDivider
            DisabledColor: =ColorDisabled
            DisabledFill: =ColorSurface
            Fill: =ColorTransparent
            Font: =FontBody
            Height: =36
            HoverBorderColor: =ColorTransparent
            HoverColor: =ColorText
            HoverFill: =ColorHoverOverlay
            OnSelect: =Navigate(scrHome, ScreenTransition.None)
            PressedBorderColor: =ColorTransparent
            PressedColor: =ColorText
            PressedFill: =ColorPressedOverlay
            RadiusBottomLeft: =2
            RadiusBottomRight: =2
            RadiusTopLeft: =2
            RadiusTopRight: =2
            Size: =12
            Text: ="Home"
            Width: =130
            X: =20
            Y: =60
      - hmeTabLine:
          Control: Label@2.5.1
          Properties:
            Color: =ColorText
            Font: =FontBody
            Height: =3
            Size: =12
            Text: =""""
            Width: =130
            X: =20
            Y: =96
            Fill: =ColorPrimary
      - hmeMain:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorBackground
            Height: =Parent.Height - 100
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingLeft: =Max(20, (Parent.Width - 1150) / 2)
            PaddingRight: =Max(20, (Parent.Width - 1150) / 2)
            Width: =Parent.Width
            Y: =100
            PaddingBottom: =24
            PaddingTop: =16
          Children:
            - hmeTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorText
                  Font: =FontBody
                  FontWeight: =FontWeight.Semibold
                  Height: =36
                  Size: =20
                  Text: ="Welcome" // AC-CON-02.1
            - hmeSayHello:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorPrimary
                  BorderThickness: =1
                  Color: =ColorOnPrimary
                  DisabledBorderColor: =ColorDivider
                  DisabledColor: =ColorDisabled
                  DisabledFill: =ColorSurface
                  Fill: =ColorPrimary
                  Font: =FontBody
                  Height: =36
                  HoverBorderColor: =ColorPrimary
                  HoverColor: =ColorOnPrimary
                  HoverFill: =ColorPrimaryHover
                  OnSelect: =Notify("Hello from " & AppTitle, NotificationType.Success) // AC-CON-02.2
                  PressedBorderColor: =ColorPrimary
                  PressedColor: =ColorOnPrimary
                  PressedFill: =ColorPrimaryPressed
                  RadiusBottomLeft: =2
                  RadiusBottomRight: =2
                  RadiusTopLeft: =2
                  RadiusTopRight: =2
                  Size: =12
                  Text: ="Say hello"
                  Width: =140
