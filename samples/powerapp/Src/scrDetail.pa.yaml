Screens:
  scrDetail:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      OnVisible: |-
        =ClearCollect(colReqs, If(varIsTreasury, Filter(COI_Requests, Status <> "Draft"), Filter(COI_Requests, RequestorEmail = User().Email)));
        ClearCollect(colHolders, {Value: "All"});
        Collect(colHolders, Distinct(colReqs, CertificateHolder));
        ClearCollect(colDocs, If(varIsTreasury, COI_Documents, FirstN(COI_Documents, 0)));
        Set(varReq, LookUp(colReqs, ID = varReq.ID));
        ClearCollect(colCovDetail, Filter(COI_Coverages, Title = varReq.Title));
        ClearCollect(colActivity, Filter(COI_Activity, Title = varReq.Title));
        Set(varShowLib, false);
        Set(varModal, "")
    Children:
      - dtlHdr:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(32, 31, 30, 1)
            Fill: =RGBA(15, 42, 74, 1)
            Font: =Font.'Segoe UI'
            Height: =56
            Size: =12
            Text: =""
            Width: =Parent.Width
      - dtlHdrTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =18
            Text: ="Certificate of Insurance"
            Width: =500
            X: =20
            Y: =6
      - dtlHdrSub:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 0.8)
            Font: =Font.'Segoe UI'
            Height: =18
            Size: =11
            Text: ="COI Request Management"
            Width: =500
            X: =20
            Y: =32
      - dtlHdrUser:
