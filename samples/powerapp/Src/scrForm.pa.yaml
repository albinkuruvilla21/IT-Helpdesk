                        PressedFill: =RGBA(12, 76, 134, 1)
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                        Size: =12
                        Text: =If(varEditing && varForm.Status = "Information Required", "Resubmit", "Submit Request")
