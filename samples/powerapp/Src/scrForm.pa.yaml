                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                        Size: =12
                        Text: ="Save Draft"
                        Visible: =!(varEditing && varForm.Status = "Information Required")
                        Width: =130
                  - frmSubmit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(15, 108, 189, 1)
                        BorderThickness: =1
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(210, 208, 206, 1)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(243, 242, 241, 1)
                        Fill: =RGBA(15, 108, 189, 1)
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HoverBorderColor: =RGBA(15, 108, 189, 1)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(16, 94, 165, 1)
                        OnSelect: |-
                          =If(IsBlank(Trim(txtPN.Text)) || IsBlank(Trim(txtCH.Text)),
                              Notify("Project Name and Certificate Holder Name are required.", NotificationType.Error),
                          Set(varSaved,
                              If(varForm.ID = 0,
                                  Patch(COI_Requests, Defaults(COI_Requests), {ProjectName: Trim(txtPN.Text), BloomPOC: txtPOC.Text, CustomerName: txtCU.Text, CertificateHolder: Trim(txtCH.Text), HolderAddress: txtAD.Text, Language: varLang, AdditionalInsured: txtAI.Text, WaiverOfSubrogation: varWos, Status: "Treasury Review", SubmittedDate: Now(), RequestorName: User().FullName, RequestorEmail: User().Email, Reviewed: false}),
                                  Patch(COI_Requests, LookUp(COI_Requests, ID = varForm.ID), {ProjectName: Trim(txtPN.Text), BloomPOC: txtPOC.Text, CustomerName: txtCU.Text, CertificateHolder: Trim(txtCH.Text), HolderAddress: txtAD.Text, Language: varLang, AdditionalInsured: txtAI.Text, WaiverOfSubrogation: varWos, Status: "Treasury Review", Reviewed: false, SubmittedDate: If(IsBlank(varForm.SubmittedDate), Now(), varForm.SubmittedDate)})
                              )
                          );
                          If(varForm.ID = 0, Set(varSaved, Patch(COI_Requests, varSaved, {Title: "COI-" & (1000 + varSaved.ID)})));
                          RemoveIf(COI_Coverages, Title = varSaved.Title);
                          ForAll(Filter(colCov, Sel), Patch(COI_Coverages, Defaults(COI_Coverages), {Title: varSaved.Title, CoverageName: CovName, OccurrenceLimit: Occ, AggregateLimit: Agg}));
                          If(varEditing && varForm.Status = "Information Required",
                              Patch(COI_Activity, Defaults(COI_Activity), {Title: varSaved.Title, Activity: "Requestor resubmitted", ActivityDate: Now(), ActionBy: User().FullName}),
                              Patch(COI_Activity, Defaults(COI_Activity), {Title: varSaved.Title, Activity: "Request submitted", ActivityDate: Now(), ActionBy: User().FullName})
                          );
                          Patch(COI_Activity, Defaults(COI_Activity), {Title: varSaved.Title, Activity: "Treasury notified", ActivityDate: Now(), ActionBy: User().FullName});
                          // HOOK: send "New / Updated COI Request" email to Treasury (Power Automate flow)
                          ClearCollect(colReqs, If(varIsTreasury, Filter(COI_Requests, Status <> "Draft"), Filter(COI_Requests, RequestorEmail = User().Email)));
                          ClearCollect(colHolders, {Value: "All"});
                          Collect(colHolders, Distinct(colReqs, CertificateHolder));
                          ClearCollect(colDocs, If(varIsTreasury, COI_Documents, FirstN(COI_Documents, 0)));
                          Set(varReq, LookUp(colReqs, ID = varSaved.ID));
                          Notify(varSaved.Title & If(varEditing && varForm.Status = "Information Required", " resubmitted", " submitted") & " successfully.", NotificationType.Success);
                          Navigate(scrDetail, ScreenTransition.None)
                          )
                        PressedBorderColor: =RGBA(15, 108, 189, 1)
