                        HoverFill: =RGBA(243, 242, 241, 1)
                        OnSelect: |-
                          =If(false, false,
                          Set(varSaved,
                              If(varForm.ID = 0,
                                  Patch(COI_Requests, Defaults(COI_Requests), {ProjectName: Trim(txtPN.Text), BloomPOC: txtPOC.Text, CustomerName: txtCU.Text, CertificateHolder: Trim(txtCH.Text), HolderAddress: txtAD.Text, Language: varLang, AdditionalInsured: txtAI.Text, WaiverOfSubrogation: varWos, Status: "Draft", RequestorName: User().FullName, RequestorEmail: User().Email, Reviewed: false}),
                                  Patch(COI_Requests, LookUp(COI_Requests, ID = varForm.ID), {ProjectName: Trim(txtPN.Text), BloomPOC: txtPOC.Text, CustomerName: txtCU.Text, CertificateHolder: Trim(txtCH.Text), HolderAddress: txtAD.Text, Language: varLang, AdditionalInsured: txtAI.Text, WaiverOfSubrogation: varWos, Status: "Draft"})
                              )
                          );
                          If(varForm.ID = 0, Set(varSaved, Patch(COI_Requests, varSaved, {Title: "COI-" & (1000 + varSaved.ID)})));
                          RemoveIf(COI_Coverages, Title = varSaved.Title);
                          ForAll(Filter(colCov, Sel), Patch(COI_Coverages, Defaults(COI_Coverages), {Title: varSaved.Title, CoverageName: CovName, OccurrenceLimit: Occ, AggregateLimit: Agg}));
                          ClearCollect(colReqs, If(varIsTreasury, Filter(COI_Requests, Status <> "Draft"), Filter(COI_Requests, RequestorEmail = User().Email)));
                          ClearCollect(colHolders, {Value: "All"});
                          Collect(colHolders, Distinct(colReqs, CertificateHolder));
                          ClearCollect(colDocs, If(varIsTreasury, COI_Documents, FirstN(COI_Documents, 0)));
                          Notify(varSaved.Title & " saved as draft.", NotificationType.Success);
                          Navigate(scrDashboard, ScreenTransition.None)
                          )
                        PressedBorderColor: =RGBA(210, 208, 206, 1)
                        PressedColor: =RGBA(32, 31, 30, 1)
                        PressedFill: =RGBA(210, 208, 206, 1)
