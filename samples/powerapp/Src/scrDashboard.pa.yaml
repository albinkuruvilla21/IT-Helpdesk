                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(15, 108, 189, 1)
                        BorderThickness: =1
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(210, 208, 206, 1)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(243, 242, 241, 1)
                        Fill: =RGBA(15, 108, 189, 1)
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HoverBorderColor: =RGBA(15, 108, 189, 1)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(16, 94, 165, 1)
                        OnSelect: |-
                          =Set(varForm, {ID: 0, Title: "", ProjectName: "", BloomPOC: User().Email, CustomerName: "", CertificateHolder: "", HolderAddress: "", AdditionalInsured: "", TreasuryNotes: "", Status: "Draft"});
                          Set(varEditing, false);
                          Set(varLang, "English");
                          Set(varWos, "Yes");
                          ClearCollect(colCov, ForAll(colCoverageNames, {CovName: N, Sel: false, Occ: "", Agg: ""}));
                          Navigate(scrForm, ScreenTransition.None)
