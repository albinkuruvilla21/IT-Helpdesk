                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(12, 76, 134, 1)
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                        Size: =12
                        Text: ="+ New COI Request"
                        Visible: =!varIsTreasury
