                        Color: =RGBA(32, 31, 30, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Size: =20
                        Text: =If(varIsTreasury, "Treasury Dashboard", "Dashboard")
