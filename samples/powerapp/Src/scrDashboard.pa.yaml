            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =Max(20, (Parent.Width - 1150) / 6)
            PaddingRight: =Max(20, (Parent.Width - 1150) / 6)
            PaddingTop: =16
            Width: =Parent.Width
